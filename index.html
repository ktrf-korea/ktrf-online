  if (ch0 !== null) for (let i = ch0; i < chairs.length; i++) chairs[i].x += dx;
}

logoImg.onload = () => { logoWait.splice(0).forEach(f => f()); };

function onLogo(f) { if (logoImg.complete && logoImg.naturalWidth) f(); else logoWait.push(f); }
function drawLogo(tex, x, y, w) {
  onLogo(() => { tex.image.getContext('2d').drawImage(logoImg, x, y, w, w * logoImg.naturalHeight / logoImg.naturalWidth); tex.needsUpdate = true; });
}
function canvasTex(w, h, draw, repeat) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(...repeat); }
  return t;
}

const carpetTex = canvasTex(256, 256, (g) => {
  for (let i = 0; i < 2; i++) for (let j = 0; j < 2; j++) {
    const alt = (i + j) % 2;
    g.fillStyle = alt ? '#b4b9c0' : '#c0c5cb'; g.fillRect(i * 128, j * 128, 128, 128);
    g.strokeStyle = alt ? '#a9aeb5' : '#cdd1d6'; g.lineWidth = 1;
    for (let k = 4; k < 128; k += 6) {
      g.beginPath();
      if (alt) { g.moveTo(i * 128 + k, j * 128); g.lineTo(i * 128 + k, j * 128 + 128); }
      else { g.moveTo(i * 128, j * 128 + k); g.lineTo(i * 128 + 128, j * 128 + k); }
      g.stroke();
    }
  }
}, [30, 11.5]);
function carpet(w, d, x, z) {
  const tx = carpetTex.clone(); tx.repeat.set(w / 2, d / 2); tx.needsUpdate = true;
  const p = new THREE.Mesh(new THREE.PlaneGeometry(w, d), new THREE.MeshStandardMaterial({ map: tx, roughness: 0.95 }));
  p.rotation.x = -Math.PI / 2; p.position.set(x, 0.001, z); p.receiveShadow = true; scene.add(p);
}

// axis 'x': z=fixed 에서 x a1→a2 로 뻗은 벽 / axis 'z': x=fixed 에서 z a1→a2
function wall(axis, fixed, a1, a2, { h = 2.6, t = 0.15, m = wallM, gaps = [], shadow = true, lintel = true } = {}) {
  const segs = []; let cur = a1;
  for (const [g1, g2] of [...gaps].sort((a, b) => a[0] - b[0])) {
    segs.push([cur, g1]);
    const len = g2 - g1, mid = (g1 + g2) / 2;
    if (h > 2.3 && lintel) { // 문 위 벽
      const l = axis === 'x' ? box(len, h - 2.2, t, m, mid, 2.2 + (h - 2.2) / 2, fixed) : box(t, h - 2.2, len, m, fixed, 2.2 + (h - 2.2) / 2, mid);
      l.castShadow = shadow;
    }
    cur = g2;
  }
  segs.push([cur, a2]);
  for (const [s, e] of segs) {
    if (e - s < 0.02) continue;

function shelf(cx, cz, len, rotY, [frameColor, boardColor], double = true, H = 2.1, levels = 5) {
  const g = new THREE.Group(); g.position.set(cx, 0, cz); g.rotation.y = rotY; g.userData.isShelf = true; scene.add(g);

function cubeBlock(xs, rows, noChair = [], depth = 2.1) {

    for (const zb of [...rows.map(z => z - half), z1]) panel(depth, 0.06, xs + s * depth / 2, zb);
    for (const z of rows) {
      if (noChair.includes(s + ',' + z)) {   // 이 칸은 책상 대신 캐비닛
        const cab = new THREE.Group(); cab.position.set(xs + s * 0.38, 0, z); scene.add(cab);

        const fx = -s * 0.315;

        box(0.58, 0.04, 1.96, M(0x3a3d42), 0, 0.02, 0, cab);              // 받침
        for (const dz of [-0.5, 0, 0.5]) box(0.012, 1.18, 0.012, line, fx, 0.66, dz, cab);   // 문 틈
        for (const c of [-0.5, 0.5]) {
          for (const d of [-0.07, 0.07]) box(0.035, 0.2, 0.025, hm, fx - s * 0.015, 0.98, c + d, cab);  // 세로 손잡이
          box(0.02, 0.035, 0.035, M(0x55595e), fx - s * 0.01, 0.84, c + 0.05, cab);                    // 열쇠 구멍
        }
        const paper = M(0xf4f6fa, { roughness: 0.9 });
        for (const [dz, n] of [[-0.6, 6], [-0.1, 4], [0.45, 7]]) for (let k = 0; k < n; k++)
          box(0.34, 0.035, 0.27, paper, 0.02 * Math.sin(k * 2.1), 1.3 + k * 0.036, dz + 0.02 * Math.cos(k * 1.7), cab);  // 서류 더미
        box(0.4, 0.3, 0.4, M(0xc8a274, { roughness: 0.9 }), 0, 1.44, 0.85, cab);   // 상자
        collide(cab);

      }
      // ㄱ자 책상: 칸막이 쪽 긴 책상 + 옆 칸막이 쪽 짧은 책상
      desk(xs + s * 0.42, z, 0.8, 2.2, 0, 0xdcc3a0, 0x5a5e63, true);
      desk(xs + s * (depth - 0.95), z - half + 0.38, 0.7, 0.6, 0, 0xdcc3a0, 0x5a5e63, true);
      if (depth >= 2) collide(box(0.42, 0.6, 0.5, M(0xd9c3a5), xs + s * 1.75, 0.3, z - half + 0.35)); // 서랍
      monitor(xs + s * 0.2, 0.765, z - 0.32, s > 0 ? Math.PI / 2 : -Math.PI / 2);
      monitor(xs + s * 0.2, 0.765, z + 0.32, s > 0 ? Math.PI / 2 : -Math.PI / 2);

/* ================= 건물 왼쪽을 가로로 넓히기 =================
   제2회의실 동쪽 벽(x -15.2)부터 왼쪽(제2회의실·연구소)을 통째로 2.6m 왼쪽으로 옮기고,
   그 경계에 걸친 벽·바닥·책장은 늘려서 이어줌 → 서고 8줄이 들어가도 성과보고회 포스터가 안 가려짐 */
{
  const XS = -15.0, DX = -2.6;
  const keep = new Set(scene.children.slice(KEEP_S0, KEEP_S1));
  const bb = new THREE.Box3(), stretchBoxes = [];
  for (const o of [...scene.children]) {
    if (keep.has(o) || o.userData.keep || o.isInstancedMesh || o.isCamera) continue;
    bb.setFromObject(o);
    if (bb.isEmpty() || o.isSprite || o.isLight) { if (o.position.x < XS) o.position.x += DX; continue; }
    if (bb.max.x <= XS) { o.position.x += DX; continue; }
    if (bb.min.x >= XS) continue;
    if (bb.max.x - bb.min.x < 6) { if ((bb.min.x + bb.max.x) / 2 < XS) o.position.x += DX; continue; }   // 나무처럼 작은 건 통째로
    // 경계에 걸친 것: 오른쪽 끝은 그대로, 왼쪽 끝만 DX만큼 늘리기
    const w = bb.max.x - bb.min.x, f = (w - DX) / w;
    const ry = ((o.rotation.y % Math.PI) + Math.PI) % Math.PI;
    if (Math.abs(ry - Math.PI / 2) < 0.01 && Math.abs(o.rotation.x) < 0.01) o.scale.z *= f;
    else if (ry < 0.01 || Math.abs(ry - Math.PI) < 0.01) o.scale.x *= f;
    else continue;
    o.position.x = bb.max.x - (bb.max.x - o.position.x) * f;
    if (o.userData.isShelf) stretchBoxes.push([bb.min.x, bb.max.x, bb.min.z, bb.max.z, f]);
  }
  colliders.forEach((c, i) => {
    if (i >= KEEP_C0 && i < KEEP_C1) return;
    if (c[1] <= XS + 0.001) { c[0] += DX; c[1] += DX; } else if (c[0] < XS) c[0] += DX;
  });
  for (const c of chairs) if (c.x < XS) c.x += DX;
  // 책: 걸친 책장 안이면 같이 늘리고, 아니면 왼쪽 것만 옮기기
  const im = scene.children.find(o => o.isInstancedMesh);
  if (im) {
    const m4 = new THREE.Matrix4();
    for (let i = 0; i < im.count; i++) {
      if (i >= KEEP_B0 && i < KEEP_B1) continue;
      im.getMatrixAt(i, m4); const x = m4.elements[12], z = m4.elements[14];
      const sb = stretchBoxes.find(s => x >= s[0] && x <= s[1] && z >= s[2] && z <= s[3]);
      if (sb) m4.elements[12] = sb[1] - (sb[1] - x) * sb[4]; else if (x < XS) m4.elements[12] = x + DX; else continue;
      im.setMatrixAt(i, m4);
    }
    im.instanceMatrix.needsUpdate = true;
  }
}

function moveJoy(e) {
  const r = joyEl.getBoundingClientRect();
  let dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
  const RR = r.width / 2 - 12, d = Math.hypot(dx, dy);
  if (d > RR) { dx *= RR / d; dy *= RR / d; }
  jx = dx / RR; jy = -dy / RR;

}

function updateCompanion(cp, owner, ownerSit, dt) {

  if (ownerSit && cp.seat) { tx = cp.seat.x; tz = cp.seat.z; ry = cp.seat.rot; sitMode = 1; }
  else if (ownerSit) { tx = owner.position.x + Math.cos(a) * 0.75; tz = owner.position.z - Math.sin(a) * 0.75; sitMode = 2; }
  else { tx = owner.position.x + Math.cos(a) * 0.8 - Math.sin(a) * 0.6; tz = owner.position.z - Math.sin(a) * 0.8 - Math.cos(a) * 0.6; }

    ry = Math.atan2(dx, dz); moving = true;

}
function photoToFace(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const S = 128, cv = document.createElement('canvas'); cv.width = cv.height = S;
      const g = cv.getContext('2d'), m = Math.min(img.width, img.height);
      g.fillStyle = '#ffffff'; g.fillRect(0, 0, S, S);
      g.save(); g.beginPath(); g.arc(S / 2, S / 2, S / 2 - 4, 0, Math.PI * 2); g.clip();
      g.drawImage(img, (img.width - m) / 2, (img.height - m) / 2 * 0.6, m, m, 0, 0, S, S);
      g.restore();
      g.beginPath(); g.arc(S / 2, S / 2, S / 2 - 4, 0, Math.PI * 2); g.lineWidth = 6; g.strokeStyle = '#ffffff'; g.stroke();
      URL.revokeObjectURL(url);
      res(cv.toDataURL('image/jpeg', 0.8));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('img')); };
    img.src = url;
  });
}

      if (!blocked(nx, player.position.z)) player.position.x = nx;

      const target = Math.atan2(mx, mz);

      diff = Math.atan2(Math.sin(diff), Math.cos(diff));
      player.rotation.y += diff * Math.min(1, dt * 12);
      u.walkT += dt * 9 * amt;
    } else amt = 0;
    const swing = Math.sin(u.walkT) * 0.55 * amt;
    u.legs[0].rotation.x = swing; u.legs[1].rotation.x = -swing;
    u.arms[0].rotation.x = -swing * 0.8; u.arms[1].rotation.x = swing * 0.8;
    player.position.y = amt ? Math.abs(Math.sin(u.walkT)) * 0.04 : 0;

      u.jumpV -= 14 * dt; u.jumpY = Math.max(0, u.jumpY + u.jumpV * dt); if (u.jumpY === 0) u.jumpV = 0;
      player.position.y += u.jumpY;

    if (u.action === 'dance') {
      u.arms[0].rotation.x = -2.6 + Math.sin(now * 8) * 0.6; u.arms[1].rotation.x = -2.6 - Math.sin(now * 8) * 0.6;
      u.legs[0].rotation.x = Math.sin(now * 8) * 0.4; u.legs[1].rotation.x = -Math.sin(now * 8) * 0.4;
      player.position.y = Math.abs(Math.sin(now * 8)) * 0.12; u.dance = true; player.rotation.y += 0.04;
    }

      u.arms[1].rotation.x = -1.05 + Math.sin(now * 14) * 0.06; u.arms[1].rotation.z = 0.35 + Math.sin(now * 7) * 0.08;
      writePad.userData.pen.position.x = 0.02 + Math.sin(now * 7) * 0.04; writePad.userData.pen.position.y = -0.02 + Math.sin(now * 14) * 0.01;
    }
    if (u.action === 'read') { readBook.visible = true; u.head.rotation.x = 0.4; u.arms[0].rotation.x = u.arms[1].rotation.x = -1.05; u.arms[0].rotation.z = -0.3; u.arms[1].rotation.z = 0.3; }
    if (u.action === 'bow') { u.head.rotation.x = 0.55; u.arms[0].rotation.x = u.arms[1].rotation.x = 0.2; }

  }
}

function updateFloaters() {
  for (let i = floaters.length - 1; i >= 0; i--) {
    const f = floaters[i], k = (now - f.start) / f.dur;
    if (k >= 1) { f.ch.remove(f.s); f.s.material.map.dispose(); f.s.material.dispose(); floaters.splice(i, 1); continue; }
    f.s.position.y = 2.45 + k * 0.5;
    f.s.material.opacity = 1 - k * k;
  }
}

    cleaner.rotation.y += ((d > 0 ? Math.PI / 2 : -Math.PI / 2) - cleaner.rotation.y) * 0.05;
    cleaner.userData.mop.rotation.y = Math.sin(t * 2.2) * 0.5;
    cleaner.userData.arms.forEach((a, i) => a.rotation.z = (i ? -1 : 1) * 0.12 + Math.sin(t * 2.2) * 0.2);
    const sw = Math.sin(t * 2.4) * 0.18;
    cleaner.userData.legs[0].rotation.x = sw; cleaner.userData.legs[1].rotation.x = -sw;
    cleaner.userData.head.rotation.y = Math.sin(t * 0.5) * 0.2 + (cleaner.userData.lookY || 0);
  }

  lampHeads.forEach((h, i) => h.material.emissiveIntensity = 0.55 + Math.sin(t * 2 + i) * 0.05);
  if (ledTex) ledTex.offset.x = (ledTex.offset.x + dt * 0.035) % 1;
  ledHeads.forEach((l, i) => l.material.emissiveIntensity = (Math.sin(t * (3 + i % 5) + i * 1.7) > 0.2) ? 1.2 : 0.15);

  // 자동문
  const near = mode === 'walk' && Math.hypot(player.position.x + 4, player.position.z - 13) < 3.2;
  doorOpen += ((near ? 1 : 0) - doorOpen) * Math.min(1, dt * 5);
  for (const d of doorPanels) d.g.position.x = d.base + d.s * 1.45 * doorOpen;

  people.forEach(applyNpcAction); applyNpcAction(walker);
  updatePlayer(dt);
  updateFairy(dt, t);
  updateTree(t);
  updateNews(t);
  updateMap(t);
  updateStamps(t);
  updateGreet(t);
  updateVisitors(t);
  updateCall(t);
  updateAgents(t);
  updateTour();
  if (quizBubble) quizBubble.position.y = 1.95 + Math.sin(performance.now() / 600) * 0.05;
  updateRemotes(dt);
  if (myPet) { myPet.ch.visible = mode === 'walk'; if (mode === 'walk') updateCompanion(myPet, player, !!sitting, dt); }
  sendMove(false);
  updateFloaters();

  if (fly) {
    const k = Math.min(1, (performance.now() - fly.start) / fly.dur);
    const e = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
    camera.position.lerpVectors(fly.fp, fly.tp, e);
    controls.target.lerpVectors(fly.ft, fly.tt, e);
    if (k >= 1) fly = null;
  }
  controls.update();
  renderer.render(scene, camera);
}

/* ---------- 소리 (파일 없이 코드로 만든 소리) ---------- */
let actx = null, master = null, whiteBuf = null, soundOn = false;
const sBtn = document.getElementById('sound');
const midi = m => 440 * Math.pow(2, (m - 69) / 12);

function noiseBuffer(brown) {
  const len = actx.sampleRate * 4, b = actx.createBuffer(1, len, actx.sampleRate), d = b.getChannelData(0);
  let last = 0;
  for (let i = 0; i < len; i++) {
    const w = Math.random() * 2 - 1;
    if (brown) { last = (last + 0.02 * w) / 1.02; d[i] = last * 3.5; } else d[i] = w;
  }
  return b;
}
function loop(fn, a, b) {
  const go = () => { if (soundOn) fn(); setTimeout(go, rand(a, b)); };
  setTimeout(go, rand(a * 0.3, b * 0.5));
}
// 에어컨 바람 소리 (계속)
function startAudio() {
  actx = new (window.AudioContext || window.webkitAudioContext)();
  master = actx.createGain(); master.gain.value = 0; master.connect(actx.destination);
  whiteBuf = noiseBuffer(false);
  const hum = actx.createBufferSource(); hum.buffer = noiseBuffer(true); hum.loop = true;
  const lp = actx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 380;
  const hg = actx.createGain(); hg.gain.value = 0.07;
  // 바람 소리 없음
}
// 키보드 타닥타닥
function click(t, g) {
  const s = actx.createBufferSource(); s.buffer = whiteBuf;
  const bp = actx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = rand(1800, 3200); bp.Q.value = 1.2;
  const e = actx.createGain();
  e.gain.setValueAtTime(0, t); e.gain.linearRampToValueAtTime(g, t + 0.002);
  e.gain.exponentialRampToValueAtTime(0.0001, t + 0.04);
  s.connect(bp).connect(e).connect(master); s.start(t, rand(0, 3), 0.05);
}
function typing() {
  let t = actx.currentTime + 0.05;
  const n = rand(5, 16) | 0;
  for (let i = 0; i < n; i++) { click(t, rand(0.025, 0.05)); t += rand(0.07, 0.2); }
}
// 책장 넘기는 소리
function pageTurn() {
  const t = actx.currentTime + 0.05;
  const s = actx.createBufferSource(); s.buffer = whiteBuf;
  const bp = actx.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 0.8;
  bp.frequency.setValueAtTime(900, t); bp.frequency.exponentialRampToValueAtTime(3500, t + 0.3);
  const e = actx.createGain();
  e.gain.setValueAtTime(0, t); e.gain.linearRampToValueAtTime(0.09, t + 0.08);
  e.gain.exponentialRampToValueAtTime(0.0001, t + 0.45);
  s.connect(bp).connect(e).connect(master); s.start(t, rand(0, 3), 0.5);
}
// 창밖 새소리
function bird() {
  let t = actx.currentTime + 0.05;
  const n = rand(2, 5) | 0, base = rand(2600, 3600);
  for (let i = 0; i < n; i++) {
    const o = actx.createOscillator(); o.type = 'sine';
    const e = actx.createGain();
    o.frequency.setValueAtTime(base, t); o.frequency.exponentialRampToValueAtTime(base * rand(1.2, 1.5), t + 0.08);
    e.gain.setValueAtTime(0, t); e.gain.linearRampToValueAtTime(0.018, t + 0.02);
    e.gain.exponentialRampToValueAtTime(0.0001, t + 0.12);
    o.connect(e).connect(master); o.start(t); o.stop(t + 0.15);
    t += rand(0.12, 0.22);
  }
}
// 배경 음악: 모두 오르골 소리 (드뷔시풍 · 캐롤 · 캐논)
function musicBox(m, t, vol, bus) {
  const f = midi(m), len = Math.max(1.2, 2.8 - (m - 60) * 0.045);
  const o = actx.createOscillator(); o.type = 'sine'; o.frequency.value = f * (1 + (Math.random() - 0.5) * 0.002);
  const o2 = actx.createOscillator(); o2.type = 'sine'; o2.frequency.value = f * 4.02;
  const o3 = actx.createOscillator(); o3.type = 'sine'; o3.frequency.value = f * 2;
  const e = actx.createGain(), e2 = actx.createGain(), e3 = actx.createGain();
  e.gain.setValueAtTime(0, t); e.gain.linearRampToValueAtTime(vol, t + 0.004);
  e.gain.exponentialRampToValueAtTime(vol * 0.35, t + 0.25); e.gain.exponentialRampToValueAtTime(0.0001, t + len);
  e2.gain.setValueAtTime(0, t); e2.gain.linearRampToValueAtTime(vol * 0.22, t + 0.003); e2.gain.exponentialRampToValueAtTime(0.0001, t + 0.35);
  e3.gain.setValueAtTime(0, t); e3.gain.linearRampToValueAtTime(vol * 0.12, t + 0.004); e3.gain.exponentialRampToValueAtTime(0.0001, t + len * 0.6);
  o.connect(e).connect(bus); o2.connect(e2).connect(bus); o3.connect(e3).connect(bus);
  for (const x of [o, o2, o3]) { x.start(t); x.stop(t + len + 0.05); }
}
// 곡 데이터: [박, 음(MIDI), 세기]
function buildDebussy() {   // 드뷔시 「달빛」 느낌의 D♭장조 분산화음 (오르골 음역으로 올림)
  const prog = [[37, [49, 56, 61, 65, 72, 75], [80, 77]], [34, [46, 53, 58, 61, 65, 72], [77]], [42, [49, 54, 58, 61, 65, 72], [73, 77]], [44, [51, 56, 61, 63, 66, 70], [75]],
    [41, [48, 53, 56, 60, 63, 68], [72]], [42, [49, 54, 58, 61, 65, 68], [73, 70]], [39, [46, 51, 54, 58, 61, 65], [70, 73]], [44, [51, 54, 60, 63, 65, 72], [72]]];
  const ev = [];
  prog.forEach(([bass, arp, mel], k) => {
    const b0 = k * 8; ev.push([b0, bass + 24, 0.5]);
    const wave = [...arp, ...arp.slice(1, -1).reverse()];
    wave.forEach((m, i) => ev.push([b0 + i * 8 / wave.length, m + 12, 0.32]));
    mel.forEach((m, i) => ev.push([b0 + 0.3 + i * 8 / mel.length, m + 12, 0.7]));
  });
  return { spb: 0.5, len: 64, ev };
}
function buildCarol() {     // 징글벨 (1857년, 저작권 없는 곡)
  const mel = [[76,1],[76,1],[76,2],[76,1],[76,1],[76,2],[76,1],[79,1],[72,1.5],[74,.5],[76,4],
    [77,1],[77,1],[77,1.5],[77,.5],[77,1],[76,1],[76,1],[76,.5],[76,.5],[76,1],[74,1],[74,1],[76,1],[74,2],[79,2],
    [76,1],[76,1],[76,2],[76,1],[76,1],[76,2],[76,1],[79,1],[72,1.5],[74,.5],[76,4],
    [77,1],[77,1],[77,1],[77,1],[77,1],[76,1],[76,1],[76,.5],[76,.5],[79,1],[79,1],[77,1],[74,1],[72,4]];
  const ev = []; let b = 0;
  for (const [m, d] of mel) { ev.push([b, m + 12, 0.75]); b += d; }
  const chords = ['C','C','C','C','F','C','D','G','C','C','C','C','F','C','G','C'];
  const tones = { C: [60, 64, 67], F: [65, 69, 72], G: [55, 59, 62, 65], D: [62, 66, 69] };
  chords.forEach((c, k) => { const tn = tones[c]; ev.push([k * 4, tn[0], 0.45]); ev.push([k * 4 + 1, tn[1] + 12, 0.25]); ev.push([k * 4 + 2, tn[0] + 12, 0.3]); ev.push([k * 4 + 3, tn[2] + 12, 0.25]); });
  return { spb: 0.36, len: 64, ev };
}
function buildCanon() {     // 파헬벨 캐논 (저작권 없는 곡)
  const prog = [[62, [62, 66, 69, 74], 90], [57, [61, 64, 69, 73], 88], [59, [62, 66, 71, 74], 86], [54, [61, 66, 69, 73], 85],
    [55, [62, 67, 71, 74], 83], [62, [62, 66, 69, 74], 81], [55, [62, 67, 71, 74], 83], [57, [61, 64, 69, 73], 85]];
  const run = [86, 90, 93, 91, 90, 86, 90, 88, 86, 83, 86, 81, 79, 83, 81, 79];   // 2번째 바퀴: 8분음표 선율
  const ev = [];
  for (let rep = 0; rep < 2; rep++) prog.forEach(([bass, arp, top], k) => {
    const b0 = (rep * 8 + k) * 4; ev.push([b0, bass, 0.5]);
    [0, 1, 2, 3, 2, 1, 0, 1].forEach((j, i) => ev.push([b0 + i * 0.5, arp[j] + 12, 0.22]));
    if (rep === 0) ev.push([b0 + 0.02, top, 0.7]);
    else { ev.push([b0 + 0.02, run[(k * 2) % 16], 0.6]); ev.push([b0 + 2.02, run[(k * 2 + 1) % 16], 0.55]); }
  });
  return { spb: 0.5, len: 64, ev };
}
function buildMerryXmas() {     // 위 위시 유 어 메리 크리스마스 (전래 캐롤, 저작권 없는 곡) · 3/4박자
  const mel = [[62,1],
    [67,1],[67,.5],[69,.5],[67,.5],[66,.5], [64,1],[64,1],[64,1], [69,1],[69,.5],[71,.5],[69,.5],[67,.5], [66,1],[62,1],[62,1],
    [71,1],[71,.5],[72,.5],[71,.5],[69,.5], [67,1],[64,1],[62,.5],[62,.5], [64,1],[69,1],[66,1], [67,2],[62,1],
    [67,1],[67,1],[67,1], [66,2],[66,1], [67,1],[66,1],[64,1], [62,2],[69,1],
    [71,1],[69,1],[67,1], [74,1],[62,1],[62,.5],[62,.5], [64,1],[69,1],[66,1], [67,3]];
  const ev = []; let b = 0;
  for (const [m, d] of mel) { ev.push([b, m + 12, 0.75]); b += d; }
  const chords = 'G C A D B E CD G G D E D G D CD G'.split(' ');
  const tones = { G: [43, 59, 62], C: [48, 64, 67], A: [45, 61, 67], D: [50, 62, 66], B: [47, 63, 66], E: [52, 59, 64] };
  chords.forEach((c, k) => {
    const b0 = 1 + k * 3;
    if (c.length === 2) { const [p, q] = [tones[c[0]], tones[c[1]]]; ev.push([b0, p[0] + 12, 0.42]); ev.push([b0 + 1, p[1], 0.2]); ev.push([b0 + 2, q[0] + 12, 0.38]); }
    else { const [r, a, bb] = tones[c]; ev.push([b0, r + 12, 0.42]); ev.push([b0 + 1, a, 0.22]); ev.push([b0 + 1, bb, 0.2]); ev.push([b0 + 2, a, 0.2]); ev.push([b0 + 2, bb, 0.18]); }
  });
  return { spb: 0.42, len: 49, ev };
}
function buildGymno() {         // 사티 「짐노페디 1번」 느낌 (1888년, 저작권 없는 곡) · 느린 3/4박자
  const ev = [];
  for (let bar = 0; bar < 16; bar++) {      // 반주: G장7화음 ↔ D장7화음
    const g = bar % 2 === 0, b0 = bar * 3;
    ev.push([b0, g ? 55 : 50, 0.42]);
    (g ? [59, 62, 66] : [57, 61, 66]).forEach((m, i) => ev.push([b0 + 1 + i * 0.02, m + 12, 0.2]));
  }
  const phrase = [[1, 78], [2, 81], [3, 79], [4, 78], [5, 73], [6, 71], [7, 73], [8, 74], [9, 69]];   // 박 단위 (마디 5부터)
  for (const off of [12, 36]) phrase.forEach(([bt, m]) => ev.push([off + bt, m, 0.7]));
  for (const bt of [24, 27, 30, 33]) ev.push([bt, 66, 0.45]);   // 길게 머무는 F#
  return { spb: 0.62, len: 48, ev };
}
const TRACKS = { debussy: ['🎵 드뷔시', buildDebussy()], carol: ['🎄 캐롤', buildCarol()], canon: ['🎻 캐논', buildCanon()], merry: ['🎅 메리 크리스마스', buildMerryXmas()], gymno: ['🌙 짐노페디', buildGymno()] };
const TRACK_ORDER = ['debussy', 'carol', 'canon', 'merry', 'gymno'];
let curTrack = 'debussy'; try { const sv = localStorage.getItem('ktrfMusic'); if (TRACKS[sv]) curTrack = sv; } catch (e) {}
let musicBus = null, musicTimer = null;
function playTrack() {
  clearTimeout(musicTimer);
  if (musicBus) { const old = musicBus; old.gain.setTargetAtTime(0, actx.currentTime, 0.15); setTimeout(() => old.disconnect(), 1500); }
  musicBus = actx.createGain(); musicBus.gain.value = 0.07; musicBus.connect(master);
  const bus = musicBus, [, tr] = TRACKS[curTrack], t0 = actx.currentTime + 0.1;
  for (const [b, m, v] of tr.ev) musicBox(m, t0 + b * tr.spb, v, bus);
  musicTimer = setTimeout(() => { if (soundOn) playTrack(); }, tr.len * tr.spb * 1000);
}
const mBtn = document.getElementById('musicBtn');
mBtn.textContent = TRACKS[curTrack][0];
mBtn.addEventListener('click', () => {
  curTrack = TRACK_ORDER[(TRACK_ORDER.indexOf(curTrack) + 1) % TRACK_ORDER.length];
  mBtn.textContent = TRACKS[curTrack][0];
  try { localStorage.setItem('ktrfMusic', curTrack); } catch (e) {}
  if (soundOn) playTrack(); else sBtn.click();
});
sBtn.addEventListener('click', async () => {
  soundOn = !soundOn;
  if (!actx) startAudio();
  if (soundOn) {
    await actx.resume();
    master.gain.cancelScheduledValues(actx.currentTime);
    master.gain.setTargetAtTime(0.45, actx.currentTime, 0.6);
    playTrack();
  } else {
    master.gain.setTargetAtTime(0, actx.currentTime, 0.3);
    clearTimeout(musicTimer);
    setTimeout(() => { if (!soundOn) actx.suspend(); }, 1200);
  }
  sBtn.textContent = soundOn ? '🔊 소리 끄기' : '🔈 소리 켜기';
  sBtn.classList.toggle('on', soundOn);
});
